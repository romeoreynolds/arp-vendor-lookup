[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arp-vendor-lookup"
version = "2.1.0"
description = "Resolve MAC addresses in ARP tables (Windows, Linux, macOS, Cisco, Palo Alto, Fortinet, Juniper) to hardware vendors - offline first."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Romeo Reynolds" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["arp", "mac", "oui", "vendor", "network", "security", "asset-inventory"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking",
  "Topic :: Security",
  "Environment :: Console",
  "Environment :: X11 Applications",
]

[project.urls]
Homepage = "https://github.com/romeoreynolds/arp-vendor-lookup"
Issues = "https://github.com/romeoreynolds/arp-vendor-lookup/issues"

[project.scripts]
arpvendor = "arp_vendor_lookup.cli:main"

[project.gui-scripts]
arpvendor-gui = "arp_vendor_lookup.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
