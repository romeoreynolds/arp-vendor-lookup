name: release

# Builds one-click apps for Windows, macOS and Linux.
# - Publishing a GitHub Release (Releases > Draft a new release) builds the apps
#   and attaches them to that release.
# - Pushes to main that touch the app or packaging run the builds as a check only.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["src/**", "packaging/**", ".github/workflows/release.yml", "pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fetch the IEEE registries once and share them with every build, so all
  # platforms bundle the same data and IEEE is only hit once per run.
  vendor-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Download IEEE vendor database
        run: |
          python -c "from pathlib import Path; from arp_vendor_lookup.oui import update_database; update_database(Path('oui_data'), progress=print)"
          ls -la oui_data
      - uses: actions/upload-artifact@v4
        with:
          name: oui_data
          path: oui_data

  build:
    needs: vendor-db
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ARP-Vendor-Lookup-windows.exe
          - os: macos-latest          # Apple Silicon
            asset: ARP-Vendor-Lookup-macos.zip
          - os: ubuntu-22.04          # older glibc = runs on more distros
            asset: ARP-Vendor-Lookup-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pyinstaller .

      - uses: actions/download-artifact@v4
        with:
          name: oui_data
          path: packaging/oui_data

      - name: Build (Windows / Linux single file)
        if: runner.os != 'macOS'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ARP-Vendor-Lookup \
            --add-data "packaging/oui_data:oui_data" packaging/launcher.py
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mv "dist/ARP-Vendor-Lookup$ext" "dist/${{ matrix.asset }}"

      - name: Build (macOS .app)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name ARP-Vendor-Lookup \
            --osx-bundle-identifier io.github.romeoreynolds.arpvendorlookup \
            --add-data "packaging/oui_data:oui_data" packaging/launcher.py
          ditto -c -k --keepParent dist/ARP-Vendor-Lookup.app "dist/${{ matrix.asset }}"

      - name: Smoke test (bundled DB, no cache)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ runner.temp }}/fresh-home
          XDG_CACHE_HOME: ${{ runner.temp }}/fresh-home/.cache
        run: |
          mkdir -p "$HOME"
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN=dist/ARP-Vendor-Lookup.app/Contents/MacOS/ARP-Vendor-Lookup
          else
            BIN="dist/${{ matrix.asset }}"; chmod +x "$BIN"
          fi
          "$BIN" samples/paloalto_panos.txt | tee out.txt
          grep -q "Fortinet" out.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  deb:
    needs: vendor-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oui_data
          path: oui_data
      - name: Work out version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"; V="${V#v}"
          else
            V=$(grep -Po '^version = "\K[^"]+' pyproject.toml)
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build .deb
        run: packaging/debian/build_deb.sh "$VERSION" oui_data dist
      - name: Test install on Debian 12 and 13
        run: |
          for img in debian:12 debian:13; do
            echo "::group::$img"
            docker run --rm -v "$PWD:/w" "$img" bash -ec "
              apt-get update -qq
              apt-get install -y -qq /w/dist/arp-vendor-lookup_${VERSION}_all.deb > /dev/null
              arpvendor /w/samples/paloalto_panos.txt | tee /tmp/out.txt
              grep -q Fortinet /tmp/out.txt
              python3 -c 'import arp_vendor_lookup.gui, tkinter; print(\"GUI imports OK\")'
              apt-get remove -y -qq arp-vendor-lookup > /dev/null
              test ! -e /usr/bin/arpvendor && echo 'Clean uninstall OK'
            "
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ARP-Vendor-Lookup-deb
          path: dist/*.deb

  release:
    needs: [build, deb]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ARP-Vendor-Lookup-*
          path: assets
          merge-multiple: true
      - name: Make Linux file executable inside a tarball
        run: |
          chmod +x assets/ARP-Vendor-Lookup-linux
          tar -C assets -czf assets/ARP-Vendor-Lookup-linux.tar.gz ARP-Vendor-Lookup-linux
          rm assets/ARP-Vendor-Lookup-linux
          (cd assets && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: assets/*
          append_body: true
          body: |
            ## Download

            | OS | File | First launch |
            |---|---|---|
            | Windows 10/11 | `ARP-Vendor-Lookup-windows.exe` | If SmartScreen appears: **More info → Run anyway** |
            | macOS (Apple Silicon) | `ARP-Vendor-Lookup-macos.zip` | Unzip, **right-click the app → Open → Open** |
            | Debian 12+ / Ubuntu / Kali / Raspberry Pi OS | `arp-vendor-lookup_*_all.deb` | `sudo apt install ./arp-vendor-lookup_*_all.deb`, then open **ARP Vendor Lookup** from the app menu |
            | Other Linux (x86_64) | `ARP-Vendor-Lookup-linux.tar.gz` | `tar xzf` it, then double-click or run `./ARP-Vendor-Lookup-linux` |

            The IEEE vendor database is built in, so lookups work offline right away.
            Builds are unsigned; verify downloads against `SHA256SUMS.txt`.
