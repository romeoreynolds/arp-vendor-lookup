name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest .
      - run: pytest -q
      - name: CLI smoke test
        shell: bash
        run: arpvendor samples/cisco_ios.txt
        env:
          ARP_VENDOR_CACHE: tests/fixtures
